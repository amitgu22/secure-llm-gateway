# Example application.properties with Bedrock Integration

# ==================== Bedrock Configuration ====================
bedrock.enabled=true
bedrock.region=us-east-1

# AWS Credentials - Use environment variables in production!
# bedrock.access-key-id=${AWS_ACCESS_KEY_ID}
# bedrock.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# Bedrock Model Configuration
# Models: 
#  - anthropic.claude-3-opus-20240229-v1:0
#  - anthropic.claude-3-sonnet-20240229-v1:0
#  - anthropic.claude-3-haiku-20240307-v1:0
#  - meta.llama2-70b-chat-v1
#  - mistral.mistral-7b-instruct-v0:2
bedrock.model-id=anthropic.claude-3-sonnet-20240229-v1:0
bedrock.max-tokens=1024
bedrock.temperature=0.7
bedrock.top-p=0.9

# ==================== LLM Service Configuration ====================
# Default provider: openai, bedrock, azure
llm.default-provider=bedrock

# Default model to use if not specified in request
llm.default-model=claude-3-sonnet

# ==================== JWT Configuration ====================
jwt.issuer=http://localhost:8080
jwt.audience=secure-llm-gateway
jwt.secret=${JWT_SECRET:your-secret-key-here}

# ==================== CORS Configuration ====================
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.max-age=3600

# ==================== Spring Boot Configuration ====================
spring.application.name=secure-llm-gateway
server.port=8080

# ==================== Logging ====================
logging.level.root=INFO
logging.level.com.secure.llm=DEBUG
logging.level.software.amazon.awssdk=WARN
